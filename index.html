<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Conservation Studio - Receipt Generator</title>
    <meta name="description" content="Professional conservation receipt generator for The Paper Conservation Studio">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 100%);
        }
        .step-indicator {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .step-active {
            background-color: #3b82f6;
            color: white;
        }
        .step-completed {
            background-color: #10b981;
            color: white;
        }
        .step-inactive {
            background-color: #e5e7eb;
            color: #6b7280;
        }
        .file-input {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
        }
        .file-input input[type=file] {
            position: absolute;
            left: -9999px;
        }
        .image-preview {
            width: 150px;
            height: 150px;
            object-fit: contain;
            background: #f3f4f6;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            border: 2px solid #e5e7eb;
        }
        
        /* Mobile responsive image preview */
        @media (max-width: 768px) {
            .image-preview {
                width: 130px;
                height: 130px;
            }
        }
        
        @media (max-width: 480px) {
            .image-preview {
                width: 110px;
                height: 110px;
            }
        }
        
        /* Fix image container for mobile */
        .image-preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .wizard-step {
            display: none;
        }
        .wizard-step.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="gradient-bg py-6">
        <div class="max-w-4xl mx-auto px-4">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white mb-2">The Paper Conservation Studio</h1>
                <p class="text-blue-100">Professional Conservation Receipt Generator</p>
            </div>

            <!-- Progress Indicator -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <div id="step1-indicator" class="step-indicator step-active">1</div>
                        <span class="ml-2 text-white text-sm hidden sm:inline">Receipt Info</span>
                    </div>
                    <div class="w-8 h-0.5 bg-blue-300"></div>
                    <div class="flex items-center">
                        <div id="step2-indicator" class="step-indicator step-inactive">2</div>
                        <span class="ml-2 text-white text-sm hidden sm:inline">Client Details</span>
                    </div>
                    <div class="w-8 h-0.5 bg-blue-300"></div>
                    <div class="flex items-center">
                        <div id="step3-indicator" class="step-indicator step-inactive">3</div>
                        <span class="ml-2 text-white text-sm hidden sm:inline">Items</span>
                    </div>
                    <div class="w-8 h-0.5 bg-blue-300"></div>
                    <div class="flex items-center">
                        <div id="step4-indicator" class="step-indicator step-inactive">4</div>
                        <span class="ml-2 text-white text-sm hidden sm:inline">Review</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Wizard Container -->
    <div class="max-w-4xl mx-auto px-4 -mt-4">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            
            <!-- Step 1: Receipt Info -->
            <div id="step1" class="wizard-step active p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Receipt Information</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Receipt Number *</label>
                        <input id="receiptNumber" type="number" placeholder="001" 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Date *</label>
                        <input id="receiptDate" type="date" 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Customer Reference</label>
                        <input id="customerRef" placeholder="Customer reference number/code"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Number of Items</label>
                        <input id="numberOfItems" type="number" value="1" min="1" 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Receipt By</label>
                        <input id="receiptBy" placeholder="Pat McBride" value="Pat McBride"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Telephone</label>
                        <input id="receiptTelephone" type="tel" value="0862451318"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- Step 2: Client Details -->
            <div id="step2" class="wizard-step p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Client Details</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Client Name *</label>
                        <input id="clientName" placeholder="Client or company name"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Contact Person</label>
                        <input id="contactName" placeholder="Contact person name"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                        <input id="clientPhone" type="tel" placeholder="Phone number"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input id="clientEmail" type="email" placeholder="email@example.com"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                        <textarea id="clientAddress" rows="3" placeholder="Full address"
                                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                </div>
            </div>

            <!-- Step 3: Items -->
            <div id="step3" class="wizard-step p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Conservation Items</h2>
                    <button onclick="addItem()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition-colors">
                        + Add Item
                    </button>
                </div>
                
                <div id="itemsContainer">
                    <!-- Items will be added dynamically -->
                </div>
            </div>

            <!-- Step 4: Review -->
            <div id="step4" class="wizard-step p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Review & Generate Receipt</h2>
                
                <div id="reviewContent" class="mb-6">
                    <!-- Review content will be populated here -->
                </div>
                
                <div class="flex space-x-4">
                    <button onclick="generatePDF()" 
                            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-lg font-semibold transition-colors">
                        📄 Generate PDF Receipt
                    </button>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="border-t bg-gray-50 px-8 py-4 flex justify-between">
                <button id="prevBtn" onclick="previousStep()" 
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-lg font-semibold transition-colors" 
                        style="display: none;">
                    ← Previous
                </button>
                <button id="nextBtn" onclick="nextStep()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors ml-auto">
                    Next →
                </button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl w-full max-w-4xl max-h-screen overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900">Receipt Preview</h2>
                <button onclick="closePreview()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-colors">
                    ✕ Close
                </button>
            </div>
            <div id="previewContent" class="p-6"></div>
        </div>
    </div>

    <script>
        // Global variables
        let currentStep = 1;
        let totalItems = 1;
        let items = [];
        let imageData = {};
        let imageRotations = {}; // Track rotation for each image

        // Initialize the wizard
        document.addEventListener('DOMContentLoaded', function() {
            // Set default date to today
            document.getElementById('receiptDate').value = new Date().toISOString().split('T')[0];
            
            // Generate initial receipt number
            generateReceiptNumber();
            
            // Initialize with one item
            addItem();
            
            // Listen for number of items changes
            document.getElementById('numberOfItems').addEventListener('change', function() {
                updateItemsBasedOnCount();
            });
        });

        function generateReceiptNumber() {
            // Generate a simple sequential number (you can make this more sophisticated)
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const receipt = `${year}${month}${day}001`; // Basic format, you can enhance this
            document.getElementById('receiptNumber').value = receipt;
        }

        // Wizard navigation
        function nextStep() {
            if (validateCurrentStep()) {
                if (currentStep < 4) {
                    hideStep(currentStep);
                    currentStep++;
                    showStep(currentStep);
                    updateStepIndicators();
                    updateNavigation();
                    
                    if (currentStep === 4) {
                        populateReview();
                    }
                }
            }
        }

        function previousStep() {
            if (currentStep > 1) {
                hideStep(currentStep);
                currentStep--;
                showStep(currentStep);
                updateStepIndicators();
                updateNavigation();
            }
        }

        function showStep(step) {
            document.getElementById(`step${step}`).classList.add('active');
        }

        function hideStep(step) {
            document.getElementById(`step${step}`).classList.remove('active');
        }

        function updateStepIndicators() {
            for (let i = 1; i <= 4; i++) {
                const indicator = document.getElementById(`step${i}-indicator`);
                indicator.classList.remove('step-active', 'step-completed', 'step-inactive');
                
                if (i < currentStep) {
                    indicator.classList.add('step-completed');
                } else if (i === currentStep) {
                    indicator.classList.add('step-active');
                } else {
                    indicator.classList.add('step-inactive');
                }
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (currentStep === 1) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
            }
            
            if (currentStep === 4) {
                nextBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'block';
            }
        }

        // Items management
        function updateItemsBasedOnCount() {
            const count = parseInt(document.getElementById('numberOfItems').value) || 1;
            const container = document.getElementById('itemsContainer');
            
            // Clear existing items
            container.innerHTML = '';
            items = [];
            
            // Add the required number of items
            for (let i = 0; i < count; i++) {
                addItem();
            }
        }

        function addItem() {
            const container = document.getElementById('itemsContainer');
            const itemIndex = items.length;
            const receiptNumber = document.getElementById('receiptNumber').value;
            const objectNumber = receiptNumber + String.fromCharCode(65 + itemIndex); // A, B, C...
            
            const itemHTML = `
                <div class="border border-gray-200 rounded-lg p-6 mb-6" id="item-${itemIndex}">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">Item ${itemIndex + 1} - ${objectNumber}</h3>
                        <button onclick="removeItem(${itemIndex})" class="text-red-600 hover:text-red-800 font-semibold">
                            Remove
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Artist</label>
                            <input id="artist-${itemIndex}" placeholder="Artist name"
                                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
                            <input id="title-${itemIndex}" placeholder="Artwork title"
                                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Image Type</label>
                            <input id="imageType-${itemIndex}" placeholder="e.g., Photograph, Painting"
                                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Media</label>
                            <input id="media-${itemIndex}" placeholder="e.g., Oil on canvas, Watercolor"
                                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Size</label>
                            <input id="size-${itemIndex}" placeholder="Dimensions"
                                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div class="flex items-center space-x-4">
                            <label class="flex items-center">
                                <input type="checkbox" id="framed-${itemIndex}" class="mr-2">
                                <span class="text-sm font-semibold text-gray-700">Framed</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-4" id="frameType-container-${itemIndex}" style="display: none;">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Frame Type</label>
                        <input id="frameType-${itemIndex}" placeholder="Describe the frame"
                               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-left">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Image</label>
                        <div class="file-input w-full">
                            <label for="imageInput-${itemIndex}" class="w-full bg-blue-50 border-2 border-dashed border-blue-300 rounded-lg p-4 text-center cursor-pointer hover:bg-blue-100 transition-colors block">
                                <div id="imagePreviewContainer-${itemIndex}" class="hidden image-preview-container">
                                    <img id="imagePreview-${itemIndex}" class="image-preview mb-2" style="transition: transform 0.3s ease;">
                                    <p class="text-sm text-gray-600">Click to change photo</p>
                                </div>
                                <div id="imageUploadPrompt-${itemIndex}">
                                    <svg class="mx-auto h-8 w-8 text-blue-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <p class="text-sm text-gray-600">Click to upload image</p>
                                </div>
                            </label>
                            <input type="file" accept="image/*" capture="environment" id="imageInput-${itemIndex}">
                        </div>
                        
                        <!-- Rotation Controls -->
                        <div id="rotationControls-${itemIndex}" class="mt-2 flex flex-wrap justify-center gap-2" style="display: none;">
                            <button type="button" onclick="rotateImage(${itemIndex}, -1)" 
                                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded-lg text-sm transition-colors">
                                ↺ Rotate Left
                            </button>
                            <button type="button" onclick="rotateImage(${itemIndex}, 1)" 
                                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded-lg text-sm transition-colors">
                                ↻ Rotate Right
                            </button>
                        </div>
                    </div>
                    
                    <!-- Agreed Next Steps -->
                    <div class="border-t pt-4">
                        <h4 class="font-semibold text-gray-900 mb-3">Agreed Next Steps</h4>
                        <div class="space-y-2">
                            <label class="flex items-start">
                                <input type="checkbox" id="assess-${itemIndex}" class="mr-2 mt-1">
                                <span class="text-sm text-gray-700">To assess the work and to provide a condition and proposed treatment report and full costing of the same</span>
                            </label>
                            <label class="flex items-start">
                                <input type="checkbox" id="conserve-${itemIndex}" class="mr-2 mt-1" onchange="togglePriceInput('conservePrice-${itemIndex}', this.checked)">
                                <span class="text-sm text-gray-700">To conserve the work at an agreed price</span>
                            </label>
                            <div id="conservePrice-${itemIndex}" class="hidden ml-6 mt-1">
                                <input type="text" id="conservePriceVal-${itemIndex}" placeholder="Enter agreed price (€)" class="border border-gray-300 rounded px-2 py-1 text-sm w-48">
                            </div>
                            <label class="flex items-start">
                                <input type="checkbox" id="mount-${itemIndex}" class="mr-2 mt-1" onchange="togglePriceInput('mountPrice-${itemIndex}', this.checked)">
                                <span class="text-sm text-gray-700">To mount the work to an agreed cost</span>
                            </label>
                            <div id="mountPrice-${itemIndex}" class="hidden ml-6 mt-1">
                                <input type="text" id="mountPriceVal-${itemIndex}" placeholder="Enter agreed cost (€)" class="border border-gray-300 rounded px-2 py-1 text-sm w-48">
                            </div>
                            <label class="flex items-start">
                                <input type="checkbox" id="materials-${itemIndex}" class="mr-2 mt-1" onchange="togglePriceInput('materialsPrice-${itemIndex}', this.checked)">
                                <span class="text-sm text-gray-700">Agreed cost of materials</span>
                            </label>
                            <div id="materialsPrice-${itemIndex}" class="hidden ml-6 mt-1">
                                <input type="text" id="materialsPriceVal-${itemIndex}" placeholder="Enter cost (€)" class="border border-gray-300 rounded px-2 py-1 text-sm w-48">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', itemHTML);
            
            // Add event listeners
            document.getElementById(`framed-${itemIndex}`).addEventListener('change', function() {
                toggleFrameType(itemIndex);
            });
            
            document.getElementById(`imageInput-${itemIndex}`).addEventListener('change', function(e) {
                handleImageUpload(e, itemIndex);
            });
            
            // Add to items array
            items.push({
                index: itemIndex,
                objectNumber: objectNumber
            });
        }

        function removeItem(index) {
            if (items.length > 1) {
                document.getElementById(`item-${index}`).remove();
                items = items.filter(item => item.index !== index);
                
                // Update number of items
                document.getElementById('numberOfItems').value = items.length;
            }
        }

        function toggleFrameType(index) {
            const checkbox = document.getElementById(`framed-${index}`);
            const frameTypeContainer = document.getElementById(`frameType-container-${index}`);
            
            if (checkbox.checked) {
                frameTypeContainer.style.display = 'block';
            } else {
                frameTypeContainer.style.display = 'none';
            }
        }

        function togglePriceInput(containerId, show) {
            const container = document.getElementById(containerId);
            if (container) {
                container.classList.toggle('hidden', !show);
                if (!show) {
                    // Clear value when unchecked
                    const input = container.querySelector('input[type=text]');
                    if (input) input.value = '';
                }
            }
        }

        function handleImageUpload(e, index) {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                
                fixImageOrientation(file, function(correctedImageData) {
                    imageData[index] = correctedImageData;
                    imageRotations[index] = 0; // Initialize rotation
                    
                    const imagePreview = document.getElementById(`imagePreview-${index}`);
                    const imagePreviewContainer = document.getElementById(`imagePreviewContainer-${index}`);
                    const imageUploadPrompt = document.getElementById(`imageUploadPrompt-${index}`);
                    
                    // Set image source — let CSS class handle sizing
                    imagePreview.src = correctedImageData;
                    imagePreview.style.transform = 'rotate(0deg)';
                    imagePreview.style.width = '';
                    imagePreview.style.height = '';
                    imagePreview.style.objectFit = '';
                    imagePreview.style.objectPosition = '';
                    
                    imagePreviewContainer.classList.remove('hidden');
                    imageUploadPrompt.style.display = 'none';
                    
                    // Show rotation controls
                    document.getElementById(`rotationControls-${index}`).style.display = 'flex';
                });
            }
        }
        
        function rotateImage(index, direction) {
            if (!imageData[index]) return;
            
            // Update rotation angle
            imageRotations[index] = (imageRotations[index] + (direction * 90)) % 360;
            
            // Apply rotation to preview
            const imagePreview = document.getElementById(`imagePreview-${index}`);
            if (imagePreview) {
                imagePreview.style.transform = `rotate(${imageRotations[index]}deg)`;
            }
            
            // Create rotated image data
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                // Set canvas size based on rotation
                if (imageRotations[index] % 180 === 90) {
                    canvas.width = img.height;
                    canvas.height = img.width;
                } else {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }
                
                // Save context and translate to center
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate((imageRotations[index] * Math.PI) / 180);
                
                // Draw image centered
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                ctx.restore();
                
                // Update imageData with rotated version (ensure JPEG quality)
                imageData[index] = canvas.toDataURL('image/jpeg', 0.8);
            };
            
            img.src = imageData[index];
        }

        // Image orientation fix function (same as before)
        function fixImageOrientation(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let orientation = 1;
                    try {
                        const exif = piexif.load(e.target.result);
                        if (exif && exif['0th'] && exif['0th'][piexif.ImageIFD.Orientation]) {
                            orientation = exif['0th'][piexif.ImageIFD.Orientation];
                        }
                    } catch (ex) {
                        // No EXIF data
                    }
                    
                    if (orientation >= 5 && orientation <= 8) {
                        canvas.width = img.height;
                        canvas.height = img.width;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    
                    switch (orientation) {
                        case 2: ctx.transform(-1, 0, 0, 1, canvas.width, 0); break;
                        case 3: ctx.transform(-1, 0, 0, -1, canvas.width, canvas.height); break;
                        case 4: ctx.transform(1, 0, 0, -1, 0, canvas.height); break;
                        case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
                        case 6: ctx.transform(0, 1, -1, 0, canvas.height, 0); break;
                        case 7: ctx.transform(0, -1, -1, 0, canvas.height, canvas.width); break;
                        case 8: ctx.transform(0, -1, 1, 0, 0, canvas.width); break;
                    }
                    
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    const correctedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                    callback(correctedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function generatePDF() {
            try {
                // Check if jsPDF is loaded
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    alert('PDF library not loaded. Please refresh the page and try again.');
                    return;
                }
                
                const { jsPDF } = window.jspdf;
                const data = collectFormData();
                
                // Validate required data
                if (!data.receiptNumber || !data.clientName) {
                    alert('Please fill in the required fields (Receipt Number and Client Name).');
                    return;
                }
            
            // Create PDF with template-based layout matching the form design
            const doc = new jsPDF();
            let yPos = 15;

            // Colours
            const brownColor  = [241, 198, 141]; // #F1C68D — header / footer / section headers
            const orangeColor = [241, 198, 141]; // #F1C68D — section headers
            const orangeText  = [95,  61,  0];   // dark brown text on orange

            // Layout constants
            const pageWidth   = 190;
            const imageWidth  = 55;
            const imageHeight = 65;
            const imageMargin = 5;
            const fieldHeight = 7;
            const labelWidth  = 45;
            const fullWidth   = pageWidth;
            const contentWithImageWidth = pageWidth - imageWidth - imageMargin;
            const pageUsable  = 277; // A4 height in mm
            const marginBot   = 15;  // bottom margin

            // ── HEADER ───────────────────────────────────────────────────────
            doc.setFillColor(brownColor[0], brownColor[1], brownColor[2]);
            doc.rect(10, yPos, fullWidth, 12, 'F');
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.setTextColor(orangeText[0], orangeText[1], orangeText[2]);
            doc.text("RECEIPT", 15, yPos + 8);
            doc.text("The Paper Conservation Studio", 200 - 15 - doc.getTextWidth("The Paper Conservation Studio"), yPos + 8);
            yPos += 15;

            // ── Helper: draw a standard form row (white background, grey border) ──
            function drawFormRow(label, value, yPosition, width = fullWidth) {
                doc.setDrawColor(160, 160, 160);
                doc.setLineWidth(0.3);
                doc.rect(10, yPosition, width, fieldHeight);
                if (label) {
                    doc.line(10 + labelWidth, yPosition, 10 + labelWidth, yPosition + fieldHeight);
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(8);
                    doc.setTextColor(0, 0, 0);
                    doc.text(label, 12, yPosition + 4.5);
                }
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.setTextColor(0, 0, 0);
                const xVal = label ? 12 + labelWidth : 12;
                const maxW = width - (label ? labelWidth : 0) - 4;
                const fitted = doc.splitTextToSize(String(value || ''), maxW)[0] || '';
                doc.text(fitted, xVal, yPosition + 4.5);
                return yPosition + fieldHeight;
            }

            // ── Helper: draw an orange section header ─────────────────────────
            function drawSectionHeader(title, yPosition, width = fullWidth) {
                doc.setFillColor(orangeColor[0], orangeColor[1], orangeColor[2]);
                doc.rect(10, yPosition, width, 7, 'F');
                doc.setDrawColor(160, 160, 160);
                doc.setLineWidth(0.3);
                doc.rect(10, yPosition, width, 7);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(9);
                doc.setTextColor(orangeText[0], orangeText[1], orangeText[2]);
                doc.text(title, 12, yPosition + 5);
                return yPosition + 7;
            }

            // ── Helper: estimate height of one item block ─────────────────────
            function estimateItemHeight(item) {
                let h = 0;
                h += 7;                    // OBJECT DETAILS header
                h += fieldHeight;          // Object No.
                h += imageHeight;          // image area (tallest element)
                // count left-side rows (they sit beside the image so height is covered by imageHeight)
                // rows that extend below image:
                const agreedItems = [
                    item.assess, item.conserve, item.mount, item.materials
                ].filter(Boolean);
                if (agreedItems.length > 0) {
                    h += 3 + 7;            // spacing + AGREED header
                    h += agreedItems.length * fieldHeight;
                }
                h += 6;                    // bottom spacing
                return h;
            }

            // ── Top receipt fields ────────────────────────────────────────────
            yPos = drawFormRow('Receipt No.',    data.receiptNumber,         yPos);
            yPos = drawFormRow('Date',           data.receiptDate,           yPos);
            yPos = drawFormRow('Customers ref.', data.customerRef,           yPos);
            yPos = drawFormRow('No. of Items',   String(data.numberOfItems), yPos);
            yPos = drawFormRow('Receipt by',     data.receiptBy,             yPos);
            yPos = drawFormRow('Contact',        data.receiptTelephone,      yPos);
            yPos += 2;

            // ── CLIENT DETAILS (orange header) ────────────────────────────────
            yPos = drawSectionHeader('CLIENT DETAILS', yPos);
            yPos = drawFormRow('Name of Client',  data.clientName,    yPos, fullWidth);
            yPos = drawFormRow('Name of Contact', data.contactName,   yPos, fullWidth);
            yPos = drawFormRow('Address',         data.clientAddress, yPos, fullWidth);
            yPos = drawFormRow('Phone Number',    data.clientPhone,   yPos, fullWidth);
            yPos = drawFormRow('Email',           data.clientEmail,   yPos, fullWidth);
            yPos += 4;

            // ── ITEMS ─────────────────────────────────────────────────────────
            // Footer height so we know how much space it needs
            const footerH = 15 + 6; // bar + spacing

            data.items.forEach((item, index) => {

                // Estimate how tall this item block will be
                const itemH = estimateItemHeight(item);

                // If the item + footer won't fit on this page, start a new page
                if (yPos + itemH + footerH > pageUsable - marginBot) {
                    doc.addPage();
                    yPos = 20;
                }

                // ── OBJECT DETAILS (orange header) first ────────────────────
                yPos = drawSectionHeader('OBJECT DETAILS', yPos);

                // ── Object No. row beneath the header ────────────────────────
                const objectLabel = data.items.length > 1
                    ? (item.objectNumber || `${data.receiptNumber}${String.fromCharCode(65 + index)}`)
                    : (item.objectNumber || data.receiptNumber);
                yPos = drawFormRow('Object No.', objectLabel, yPos);

                // Reserve image column
                const currentImageX = 10 + contentWithImageWidth + imageMargin;
                const currentImageY = yPos;

                doc.setDrawColor(160, 160, 160);
                doc.setLineWidth(0.3);
                doc.rect(currentImageX, currentImageY, imageWidth, imageHeight);

                // Artwork fields beside image — only non-empty
                if (item.artist)    yPos = drawFormRow('Artist',     item.artist,    yPos, contentWithImageWidth);
                if (item.title)     yPos = drawFormRow('Title',      item.title,     yPos, contentWithImageWidth);
                if (item.imageType) yPos = drawFormRow('Image type', item.imageType, yPos, contentWithImageWidth);
                if (item.media)     yPos = drawFormRow('Media',      item.media,     yPos, contentWithImageWidth);
                if (item.size)      yPos = drawFormRow('Size',       item.size,      yPos, contentWithImageWidth);
                yPos = drawFormRow('Framed', item.framed ? 'Framed' : 'Unframed', yPos, contentWithImageWidth);
                if (item.framed && item.frameType) {
                    yPos = drawFormRow('Frame Type', item.frameType, yPos, contentWithImageWidth);
                }

                // Move past image
                yPos = Math.max(yPos, currentImageY + imageHeight + 1);

                // Place image
                if (item.imageData) {
                    try {
                        const fmt = item.imageData.startsWith('data:image/png') ? 'PNG' : 'JPEG';
                        doc.addImage(item.imageData, fmt, currentImageX + 2, currentImageY + 2, imageWidth - 4, imageHeight - 4);
                    } catch (e) {
                        doc.setFont("helvetica", "italic");
                        doc.setFontSize(7);
                        doc.setTextColor(150, 150, 150);
                        doc.text('Image error', currentImageX + 4, currentImageY + imageHeight / 2);
                    }
                }

                // ── AGREED NEXT STEPS (orange header) — only if ticked ────────
                const agreedItems = [
                    item.assess    && 'To assess the work and to provide a condition and treatment report and full costings',
                    item.conserve  && ('To conserve the work at an agreed price' + (item.conservePrice  ? `: \u20AC${item.conservePrice}`  : '')),
                    item.mount     && ('To mount the work to an agreed cost'     + (item.mountPrice     ? `: \u20AC${item.mountPrice}`     : '')),
                    item.materials && ('Agreed cost of materials'                + (item.materialsPrice ? `: \u20AC${item.materialsPrice}` : ''))
                ].filter(Boolean);

                if (agreedItems.length > 0) {
                    yPos += 3;
                    yPos = drawSectionHeader('AGREED NEXT STEPS', yPos);
                    agreedItems.forEach(txt => {
                        yPos = drawFormRow('', txt, yPos, fullWidth);
                    });
                }

                yPos += 6;
            });

            // ── FOOTER — push to new page if it won't fit ─────────────────────
            yPos += 4;
            if (yPos + footerH > pageUsable - marginBot) {
                doc.addPage();
                yPos = 20;
            }

            doc.setFillColor(brownColor[0], brownColor[1], brownColor[2]);
            doc.rect(10, yPos, fullWidth, 15, 'F');
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.setTextColor(orangeText[0], orangeText[1], orangeText[2]);
            const line1 = 'Address: Unit 64 The Design Tower, Pearse Street, Dublin 2   Telephone: 01-6707984   Mobile: 086 2451318';
            const line2 = 'Web: paperconservationstudio.ie   Email: info@paperconservationstudio.ie';
            doc.text(line1, 10 + fullWidth / 2 - doc.getTextWidth(line1) / 2, yPos + 5);
            doc.text(line2, 10 + fullWidth / 2 - doc.getTextWidth(line2) / 2, yPos + 11);

            // Generate and share
            const blob = doc.output("blob");
            showSharingOptions(blob, data.receiptNumber, 'Conservation Receipt', data.clientName);
            
            } catch (error) {
                console.error('PDF generation error:', error);
                alert('Error generating PDF: ' + error.message + '. Please check your form data and try again.');
            }
        }

            window.currentSharingModal = modal;
        }

        function shareViaEmail(receiptNumber, jobTitle, clientName) {
            const subject = encodeURIComponent(`Conservation Receipt - ${receiptNumber}`);
            const body = encodeURIComponent(`Dear ${clientName},\n\nPlease find attached the conservation receipt for your artwork.\n\nReceipt Number: ${receiptNumber}\nDate: ${document.getElementById('receiptDate').value}\n\nThank you for choosing The Paper Conservation Studio.\n\nBest regards,\nPat McBride\nThe Paper Conservation Studio`);
            
            const mailtoLink = `mailto:?subject=${subject}&body=${body}`;
            window.open(mailtoLink);
            
            downloadPDF();
            
            setTimeout(() => {
                alert('Your email client should open with a pre-filled message. Please attach the downloaded PDF file to complete the email.');
            }, 1000);
            
            closeSharingModal();
        }

        function downloadPDF() {
            const url = URL.createObjectURL(window.currentPdfBlob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `conservation-receipt-${window.currentReceiptNumber}.pdf`;
            a.click();
            URL.revokeObjectURL(url);
            closeSharingModal();
        }

        function shareViaWhatsApp(receiptNumber, jobTitle, clientName) {
            // Create WhatsApp message
            const message = encodeURIComponent(
                `Hi! I'm sending you a conservation receipt from The Paper Conservation Studio.\n\n` +
                `Receipt Number: ${receiptNumber}\n` +
                `Client: ${clientName}\n` +
                `Date: ${document.getElementById('receiptDate').value}\n\n` +
                `Please download the PDF attachment for the complete receipt.\n\n` +
                `Best regards,\nThe Paper Conservation Studio`
            );
            
            // Download PDF first
            downloadPDF();
            
            // Open WhatsApp with message
            const whatsappUrl = `https://wa.me/?text=${message}`;
            window.open(whatsappUrl, '_blank');
            
            // Show instruction
            setTimeout(() => {
                alert('WhatsApp should open with a pre-filled message. Please attach the downloaded PDF file to complete the message.');
            }, 1000);
            
            closeSharingModal();
        }

        function closeSharingModal() {
            if (window.currentSharingModal) {
                document.body.removeChild(window.currentSharingModal);
                window.currentSharingModal = null;
            }
        }

        function closePreview() {
            document.getElementById('preview').classList.add('hidden');
        }
    </script></body>
</html>
